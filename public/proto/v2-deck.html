<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Призма · Колода — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2ede1; --ink:#17150f;
  --A:#7b5cff; --B:#ff6b4a; --skip:#8f8a7a;
  --met:#0f9d6c; --unmet:#e0457b; --val:#6c4de0;
  --e-out:cubic-bezier(.16,1,.3,1); --e-spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:"JetBrains Mono",monospace;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(23,21,15,.16) 1px,transparent 1px);background-size:14px 14px}
.app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:14px 16px 12px;position:relative}
header{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:Unbounded;font-weight:900;font-size:13px;letter-spacing:.1em}
.step{font-size:11px;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;background:#fff}
.dilemma{margin-top:16px;font-family:Unbounded;font-size:19px;font-weight:700;line-height:1.3;overflow:visible;padding-bottom:.18em}
.dilemma span{background:var(--ink);color:var(--paper);padding:1px 8px;border-radius:8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* --- колода --- */
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center}
.edge{position:absolute;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;padding:12px 6px;border:2px dashed var(--ink);border-radius:12px;opacity:.5}
.edge b{font-size:14px}
.edge.l{left:2px;color:var(--B);border-color:var(--B)}
.edge.r{right:2px;color:var(--A);border-color:var(--A);transform:translateY(-50%) rotate(180deg)}
.edge.on{opacity:1;border-style:solid}
.card{position:absolute;width:min(74%,290px);height:min(56%,360px);border-radius:22px;
  border:2.5px solid var(--ink);background:#fff;box-shadow:8px 8px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  cursor:grab;touch-action:none;user-select:none;
  transition:transform .35s var(--e-spring),opacity .3s var(--e-out)}
.card.drag{transition:none;cursor:grabbing}
.card .tri-big{width:110px;height:96px;clip-path:polygon(50% 4%,97% 93%,3% 93%);
  display:flex;align-items:flex-end;justify-content:center;padding:0 12px 18px;
  font-family:Unbounded;font-weight:700;font-size:15px;color:#fff;text-align:center;line-height:1.15}
.card .hint{font-size:11px;color:#8f8a7a}
.card .tagA,.card .tagB{position:absolute;top:16px;font-family:Unbounded;font-weight:900;font-size:15px;
  padding:5px 12px;border:2.5px solid;border-radius:10px;opacity:0;transition:opacity .15s var(--e-out)}
.card .tagA{right:14px;color:var(--A);border-color:var(--A);transform:rotate(10deg)}
.card .tagB{left:14px;color:var(--B);border-color:var(--B);transform:rotate(-10deg)}
.card .tagSkip{position:absolute;bottom:14px;font-family:Unbounded;font-weight:700;font-size:12px;
  padding:4px 10px;border:2px solid var(--skip);border-radius:8px;color:var(--skip);opacity:0;transition:opacity .15s var(--e-out)}
.under{position:absolute;width:min(74%,290px);height:min(56%,360px);border-radius:22px;border:2.5px solid var(--ink);background:#e6dfd0}
.under.u1{transform:rotate(-4deg) translateY(6px)}
.under.u2{transform:rotate(3deg) translateY(12px);opacity:.6}

/* --- линзы-бар --- */
.lensbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:2.5px solid var(--ink);
  padding:12px 14px 16px;transform:translateY(110%);transition:transform .3s var(--e-spring);z-index:40}
.lensbar.open{transform:none}
.lensbar h4{font-family:Unbounded;font-size:13px;margin-bottom:8px}
.row{display:flex;gap:7px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.pill{flex:none;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;
  padding:7px 12px;font:700 12px "JetBrains Mono";cursor:pointer;box-shadow:3px 3px 0 var(--ink);
  transition:transform .12s var(--e-out),background .12s var(--e-out)}
.pill:active{transform:translate(2px,2px)}
.pill.on.met{background:var(--met);color:#fff}
.pill.on.unmet{background:var(--unmet);color:#fff}
.pill.on.val{background:var(--val);color:#fff}
.lens-ok{width:100%;margin-top:10px;border:2.5px solid var(--ink);border-radius:14px;padding:13px;
  background:var(--ink);color:var(--paper);font:700 14px "JetBrains Mono";cursor:pointer;box-shadow:4px 4px 0 rgba(23,21,15,.3)}
.lens-ok:active{transform:translate(2px,2px)}
.counts{display:flex;justify-content:space-between;font-size:12px;font-weight:700;padding:8px 2px}
.counts .ca{color:var(--A)}.counts .cb{color:var(--B)}
.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--ink);color:var(--paper);
  font:700 12px "JetBrains Mono";padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .25s var(--e-out);pointer-events:none}
.verdict{position:fixed;inset:0;z-index:90;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.verdict[hidden]{display:none}
.verdict .big{font-family:Unbounded;font-size:24px;font-weight:900;text-align:center;overflow:visible;padding-bottom:.18em}
.verdict p{text-align:center;font-size:13px;line-height:1.6;max-width:320px}
.verdict .cta{border:2.5px solid var(--ink);border-radius:14px;padding:14px 26px;background:var(--A);color:#fff;
  font:900 14px Unbounded;cursor:pointer;box-shadow:5px 5px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header><div class="logo">ПРИЗМА◭</div><div class="step">«Колода» · <span id="prog"></span></div></header>
  <div class="dilemma">делиться ли <span>своим творчеством</span> публично</div>
  <div class="counts"><span class="cb">← Б · не делюсь <b id="cntB">0</b></span><span class="ca"><b id="cntA">0</b> · А · делюсь →</span></div>
  <div class="stage" id="stage">
    <div class="edge l"><b>Б</b> не делюсь</div>
    <div class="edge r"><b>А</b> делюсь</div>
    <div class="under u2"></div><div class="under u1"></div>
    <div class="card" id="card">
      <div class="tagB">Б</div><div class="tagA">А</div>
      <div class="tri-big" id="triBig"><span id="cardWord"></span></div>
      <div class="tagSkip">мимо ↓</div>
      <div class="hint">тяни карту: А → · ← Б · ↓ не моё</div>
    </div>
  </div>
  <div class="lensbar" id="lensbar">
    <h4 id="lbTitle"></h4>
    <div class="row" id="lbFeel"></div>
    <div class="row" id="lbVal" style="margin-top:6px"></div>
    <button class="lens-ok" id="lbOk">ок, дальше →</button>
  </div>
  <div class="toast" id="toast"></div>
</div>

<div class="verdict" id="verdict" hidden>
  <div class="big" id="vTitle"></div><p id="vText"></p>
  <button class="cta" onclick="location.reload()">перетасовать</button>
</div>

<script>
const NEEDS=["безопасность","близость","свобода","признание","творчество","стабильность","самовыражение","отдых","развитие","любовь","уверенность","новизна","поддержка","смысл","автономия","приватность","забота","игра"];
const FEEL=["радость","спокойствие","воодушевление","облегчение","гордость","уверенность","нежность","предвкушение","лёгкость","сила","тревога","страх","стыд","вина","обида","одиночество","усталость","сомнение","скука","беспомощность"];
const VALS=["честность","свобода","семья","смелость","развитие","стабильность","творчество","любовь","признание","вклад в мир","независимость","справедливость"];
const HEAVY=new Set(["тревога","страх","стыд","вина","обида","одиночество","усталость","сомнение","скука","беспомощность"]);
const HUES=[255,15,45,150,200,330,280,110,60,190];
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const card=document.getElementById("card"),stage=document.getElementById("stage");
let i=0,cur=null,dragging=false,assigned=false;
const piles={A:[],B:[]};

function deal(){
  if(i>=NEEDS.length){verdict();return}
  const n=NEEDS[i];assigned=false;
  document.getElementById("cardWord").textContent=n;
  const h=hue(n);
  document.getElementById("triBig").style.background=`linear-gradient(160deg,hsl(${h} 80% 70%),hsl(${(h+40)%360} 75% 55%))`;
  document.getElementById("prog").textContent=(i+1)+"/"+NEEDS.length;
  card.style.transform="";card.style.opacity="";card.classList.remove("drag");
  document.querySelectorAll(".tagA,.tagB,.tagSkip").forEach(t=>t.style.opacity=0);
}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.style.opacity=1;setTimeout(()=>el.style.opacity=0,900)}

card.addEventListener("pointerdown",e=>{
  if(assigned)return;dragging=true;card.setPointerCapture(e.pointerId);card.classList.add("drag");
  const sx=e.clientX,sy=e.clientY;
  const move=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;
    card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/14}deg)`;
    card.querySelector(".tagA").style.opacity=Math.max(0,Math.min(1,dx/80));
    card.querySelector(".tagB").style.opacity=Math.max(0,Math.min(1,-dx/80));
    card.querySelector(".tagSkip").style.opacity=Math.max(0,Math.min(1,dy/90));
    document.querySelector(".edge.l").classList.toggle("on",dx<-60);
    document.querySelector(".edge.r").classList.toggle("on",dx>60)};
  const up=ev=>{dragging=false;card.classList.remove("drag");
    card.removeEventListener("pointermove",move);card.removeEventListener("pointerup",up);
    const dx=ev.clientX-sx,dy=ev.clientY-sy;
    document.querySelectorAll(".edge").forEach(x=>x.classList.remove("on"));
    if(dx>90)fly("A",1);else if(dx<-90)fly("B",-1);else if(dy>110){i++;toast("мимо");deal()}
    else card.style.transform=""};
  card.addEventListener("pointermove",move);card.addEventListener("pointerup",up);
});

function fly(side,dir){
  assigned=true;const w=stage.offsetWidth;
  card.style.transition="transform .35s cubic-bezier(.5,0,.9,.4),opacity .35s";
  card.style.transform=`translate(${dir*w}px,60px) rotate(${dir*30}deg)`;card.style.opacity=0;
  const item={need:NEEDS[i],feelings:[],values:[]};piles[side].push(item);
  document.getElementById("cnt"+side).textContent=piles[side].length;
  toast(side==="A"?"в колоду А":"в колоду Б");
  setTimeout(()=>openLens(item),380);
}

function openLens(item){
  cur=item;
  document.getElementById("lbTitle").textContent="▲ "+item.need+" — линзы";
  const f=document.getElementById("lbFeel"),v=document.getElementById("lbVal");
  f.innerHTML=v.innerHTML="";
  FEEL.forEach(w=>{const p=document.createElement("button");p.className="pill "+(HEAVY.has(w)?"unmet":"met");
    p.textContent=w;p.onclick=()=>{tog(item.feelings,w);p.classList.toggle("on")};f.appendChild(p)});
  VALS.forEach(w=>{const p=document.createElement("button");p.className="pill val";
    p.textContent=w;p.onclick=()=>{tog(item.values,w);p.classList.toggle("on")};v.appendChild(p)});
  document.getElementById("lensbar").classList.add("open");
}
document.getElementById("lbOk").onclick=()=>{
  document.getElementById("lensbar").classList.remove("open");i++;deal();
};
function tog(arr,w){const i=arr.indexOf(w);i<0?arr.push(w):arr.splice(i,1)}

function verdict(){
  const a=piles.A.length,b=piles.B.length;
  document.getElementById("vTitle").textContent=a===b?"Колода разделилась поровну":(a>b?"Колода тянет к А":"Колода тянет к Б");
  document.getElementById("vText").textContent=`А: ${a} потребностей · Б: ${b}. Линзы на картах покажут, где чувства сильнее.`;
  document.getElementById("verdict").hidden=false;
}
deal();
</script>
</body>
</html>
